# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: IPAM / Geofeed
spec:
  description: Full-stack IP address management system with separate MySQL, NestJS backend, and Next.js frontend services.
  icon: https://cdn.zeabur.com/marketplace/mysql.svg
  variables:
    - key: FRONTEND_DOMAIN
      type: DOMAIN
      name: Frontend domain
      description: Public domain for the IPAM web UI.
    - key: BACKEND_DOMAIN
      type: DOMAIN
      name: Backend API domain
      description: Public domain for the NestJS API service.
    - key: AUTH_SECRET_INPUT
      type: PASSWORD
      name: API auth signing secret
      description: HMAC secret for backend API auth tokens. Must be at least 32 characters. Generate with `openssl rand -base64 48`.
    - key: BOOTSTRAP_TOKEN_INPUT
      type: PASSWORD
      name: First-admin bootstrap token
      description: One-time token to create the first admin account via POST /api/auth/bootstrap. Must be at least 16 characters. Generate with `openssl rand -base64 32`. Set BOOTSTRAP_DISABLED=true after the first admin exists.
  readme: |
    # IPAM / Geofeed

    This template deploys three separate services automatically:

    - `mysql`: MySQL 8.0 with persistent storage.
    - `backend`: NestJS API built from this repository root with an inline Dockerfile.
    - `frontend`: Next.js UI built from this repository root with an inline Dockerfile.

    You do not need to choose `backend/` or `frontend/` as a root directory. Deploy this YAML as a Zeabur template instead of importing the repository as a normal single Git service.

    ## Required input

    - Generate a Zeabur domain for `FRONTEND_DOMAIN`.
    - Generate a Zeabur domain for `BACKEND_DOMAIN`.
    - Publish the frontend image from Docker-capable CI with the required BuildKit `heroui_token` secret.

    ## Runtime behavior

    - The backend receives `DATABASE_URL` from the MySQL service and runs `npm run db:deploy` before starting.
    - The frontend calls `/api` by default and proxies requests to the backend service through `API_PROXY_TARGET`.
    - The first browser visit asks you to create the first administrator account.
  services:
    - name: mysql
      icon: https://cdn.zeabur.com/marketplace/mysql.svg
      template: PREBUILT
      spec:
        id: mysql
        source:
          image: mysql:8.0
        ports:
          - id: database
            port: 3306
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/mysql
        instructions:
          - title: Command to connect to your MySQL
            content: mysqlsh --sql --host=${PORT_FORWARDED_HOSTNAME} --port=${DATABASE_PORT_FORWARDED_PORT} --user=${MYSQL_USERNAME} --password=${MYSQL_PASSWORD} --schema=${MYSQL_DATABASE}
          - title: MySQL username
            content: ${MYSQL_USERNAME}
          - title: MySQL password
            content: ${MYSQL_PASSWORD}
          - title: MySQL database
            content: ${MYSQL_DATABASE}
          - title: MySQL host
            content: ${PORT_FORWARDED_HOSTNAME}
          - title: MySQL port
            content: ${DATABASE_PORT_FORWARDED_PORT}
        env:
          MYSQL_DATABASE:
            default: ipam
            expose: true
          MYSQL_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          MYSQL_PASSWORD:
            default: ${MYSQL_ROOT_PASSWORD}
            expose: true
          MYSQL_PORT:
            default: ${DATABASE_PORT}
            expose: true
          MYSQL_ROOT_PASSWORD:
            default: ${PASSWORD}
          MYSQL_USERNAME:
            default: root
            expose: true
          MYSQL_URI:
            default: mysql://${MYSQL_USERNAME}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
            expose: true
          MYSQL_CONNECTION_STRING:
            default: mysql://${MYSQL_USERNAME}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
            expose: true
        configs:
          - path: /etc/my.cnf
            template: |
              [mysqld]
              default-authentication-plugin=mysql_native_password
              host-cache-size=0
              skip-name-resolve
              datadir=/var/lib/mysql
              socket=/var/run/mysqld/mysqld.sock
              secure-file-priv=/var/lib/mysql-files
              user=mysql
              max_allowed_packet=10M
              performance_schema=off

              pid-file=/var/run/mysqld/mysqld.pid
              [client]
              socket=/var/run/mysqld/mysqld.sock

              !includedir /etc/mysql/conf.d/
            permission: null
            envsubst: null

    - name: backend
      template: GIT
      dependencies:
        - mysql
      domainKey: BACKEND_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1234126366
          branch: main
          dockerfile: |
            # syntax=docker/dockerfile:1.7

            FROM node:20-bookworm-slim AS builder

            WORKDIR /app

            RUN apt-get update \
              && apt-get install -y --no-install-recommends openssl ca-certificates \
              && rm -rf /var/lib/apt/lists/*

            COPY backend/package*.json ./
            COPY backend/prisma ./prisma
            RUN npm ci

            COPY backend/nest-cli.json backend/tsconfig.json ./
            COPY backend/src ./src
            RUN npm run db:generate && npm run build

            FROM node:20-bookworm-slim AS production-deps

            WORKDIR /app

            RUN apt-get update \
              && apt-get install -y --no-install-recommends openssl ca-certificates \
              && rm -rf /var/lib/apt/lists/*

            COPY backend/package*.json ./
            COPY backend/prisma ./prisma
            RUN npm ci --omit=dev && npm cache clean --force

            FROM node:20-bookworm-slim AS runtime

            WORKDIR /app

            RUN apt-get update \
              && apt-get install -y --no-install-recommends openssl ca-certificates \
              && rm -rf /var/lib/apt/lists/*

            ENV NODE_ENV=production \
                PORT=8080

            LABEL io.ipam.image.name="ipam-backend" \
                  io.ipam.image.dockerfile="Dockerfile.backend" \
                  io.ipam.image.secret-required="false" \
                  io.ipam.image.entrypoint="sh scripts/start-prod.sh" \
                  io.ipam.image.ports="8080" \
                  io.ipam.image.runtime-uid="1000"

            COPY --from=production-deps --chown=node:node /app/node_modules ./node_modules
            COPY --from=builder --chown=node:node /app/dist ./dist
            COPY --chown=node:node backend/package*.json ./
            COPY --chown=node:node backend/prisma ./prisma
            COPY --chown=node:node backend/scripts ./scripts

            USER node

            EXPOSE 8080

            ENTRYPOINT ["sh", "scripts/start-prod.sh"]
          watchPaths:
            - /backend/**
            - /Dockerfile.backend
            - /zeabur.yaml
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /api/health/ready
        ports:
          - id: web
            port: 8080
            type: HTTP
        env:
          PORT:
            default: "8080"
          DATABASE_URL:
            default: mysql://${MYSQL_USERNAME}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
          CORS_ORIGINS:
            default: https://${FRONTEND_DOMAIN}
          AUTH_SECRET:
            default: ${AUTH_SECRET_INPUT}
          BOOTSTRAP_TOKEN:
            default: ${BOOTSTRAP_TOKEN_INPUT}
          BOOTSTRAP_DISABLED:
            default: "false"
          AUTH_TOKEN_TTL_HOURS:
            default: "24"

    - name: frontend
      template: GIT
      dependencies:
        - backend
      domainKey: FRONTEND_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1234126366
          branch: main
          dockerfile: |
            # syntax=docker/dockerfile:1.10

            FROM node:20-bookworm-slim AS builder

            WORKDIR /app

            RUN apt-get update \
              && apt-get install -y --no-install-recommends libsecret-1-0 ca-certificates \
              && rm -rf /var/lib/apt/lists/*

            COPY frontend/package*.json ./
            RUN --mount=type=secret,id=heroui_token,env=HEROUI_AUTH_TOKEN,required=true npm ci

            ARG NEXT_PUBLIC_API_URL=/api
            ENV NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} \
                NEXT_TELEMETRY_DISABLED=1

            COPY frontend/next-env.d.ts frontend/next.config.ts frontend/tsconfig.json frontend/postcss.config.mjs frontend/eslint.config.mjs ./
            COPY frontend/src ./src

            RUN npm run build

            FROM node:20-bookworm-slim AS runtime

            WORKDIR /app

            ENV NODE_ENV=production \
                NEXT_TELEMETRY_DISABLED=1 \
                HOSTNAME=0.0.0.0 \
                PORT=8080 \
                APP_ORIGIN=http://localhost:8080 \
                API_PROXY_TARGET=http://127.0.0.1:3001

            LABEL io.ipam.image.name="ipam-frontend" \
                  io.ipam.image.dockerfile="Dockerfile.frontend" \
                  io.ipam.image.secret-required="true" \
                  io.ipam.image.entrypoint="node server.js" \
                  io.ipam.image.ports="8080" \
                  io.ipam.image.runtime-uid="1000"

            COPY --from=builder --chown=node:node /app/.next/standalone ./
            COPY --from=builder --chown=node:node /app/.next/static ./.next/static

            USER node

            EXPOSE 8080

            ENTRYPOINT ["node", "server.js"]
          watchPaths:
            - /frontend/**
            - /Dockerfile.frontend
            - /zeabur.yaml
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /
        ports:
          - id: web
            port: 8080
            type: HTTP
        env:
          PORT:
            default: "8080"
          NEXT_PUBLIC_API_URL:
            default: /api
          API_PROXY_TARGET:
            default: http://${BACKEND_HOST}:8080
          APP_ORIGIN:
            default: https://${FRONTEND_DOMAIN}

localization:
  zh-CN:
    description: 前后端和数据库分离部署的 IPAM / Geofeed 系统，包含 MySQL、NestJS 后端、Next.js 前端、登录认证和 RFC 8805 Geofeed。
    readme: |
      # IPAM / Geofeed

      该模板会自动创建三个独立服务：

      - `mysql`：带持久化存储的 MySQL 8.0。
      - `backend`：NestJS API，从仓库根目录使用内联 Dockerfile 构建。
      - `frontend`：Next.js UI，从仓库根目录使用内联 Dockerfile 构建。

      你不需要手动选择 `backend/` 或 `frontend/` 目录。请把这个 YAML 当作 Zeabur 模板部署，不要用普通 Git 导入方式创建单个服务。

      ## 必填项

      - 为 `FRONTEND_DOMAIN` 生成 Zeabur 域名。
      - 为 `BACKEND_DOMAIN` 生成 Zeabur 域名。
      - `HEROUI_AUTH_TOKEN` 填写 HeroUI Pro 的 CI/CD Token。

      ## 运行行为

      - 后端从 MySQL 服务接收 `DATABASE_URL`，启动前会执行 `npm run db:deploy`。
      - 前端默认请求 `/api`，由 Next.js 服务端通过 `API_PROXY_TARGET` 代理到后端服务。
      - 第一次打开前端页面时创建第一个管理员账号。
